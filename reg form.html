<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--Complete Registration Form Example-->
<form action="/submit" method="POST">
 
    <!-- Text Input -->
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" placeholder="John Doe" required>
 
    <!-- Email Input -->
    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" placeholder="john@example.com" required>
    <!-- Password Input -->
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" minlength="8">
 
    <!-- Number Input -->
    <label for="age">Age:</label>
    <input type="number" id="age" name="age" min="18" max="100">
<!-- Radio Buttons (choose ONE) -->
    <p>I am <a href=""></a>:</p>
    <input type="radio" id="student" name="level" value="beginner">
    <label for="student">Student</label>
    <input type="radio" id="professional" name="level" value="intermediate">
    <label for="professional">Professional</label>
    <input type="radio" id="expert" name="level" value="advanced">
    <label for="expert">Expert</label>
    <input type="radio" id="other" name="level" value="other">
    <label for="other">Other</label>
 
    <!-- Checkboxes (choose MANY) -->
    <p>Technologies interested in:</p>
    <input type="checkbox" id="html" name="tech" value="html">
    <label for="html">HTML</label>
    <input type="checkbox" id="css" name="tech" value="css">
    <label for="css">CSS</label>
    <input type="checkbox" id="javascript" name="tech" value="javascript">
    <label for="javascript">JavaScript</label>
    <input type="checkbox" id="nodejs" name="tech" value="nodejs">
    <label for="nodejs">Node.js</label>

<!-- Dropdown Select -->
    <label for="country">Country:</label>
    <select id="country" name="country">
        <option value="">-- Choose Country --</option>
        <option value="in">India</option>
        <option value="us">United States</option>
        <option value="uk">United Kingdom</option>
        <option value="ca">Canada</option>
        <option value="au">Australia</option>
    </select>
 
    <!-- Textarea (multi-line text) -->
    <label for="message">Your Message:</label>
    <textarea id="message" name="message" rows="5" placeholder="Type here..."></textarea>

<!-- File Upload -->
    <label for="qualifications">Educational Qualifications:</label>
    <input type="file" id="qualifications" name="qualifications" accept=".pdf,.doc">
 
    <!-- Date Picker -->
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob">
 
    <!-- Submit Button -->
    <button type="submit">Send Message</button>
    <button type="reset">Clear Form</button>
 
</form>
    
</body>
</html>
